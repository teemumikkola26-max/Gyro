<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asentomittari</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1c1c1a;--mut:#74746e;--line:#dcdcd6;--acc:#d9480f;--x:#1c7ed6;--y:#2f9e44;--z:#d9480f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--fg:#ececE8;--mut:#9a9a92;--line:#34342f;--acc:#ff8a4c;--x:#74c0fc;--y:#8ce99a;--z:#ff8a4c}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--fg:#ececE8;--mut:#9a9a92;--line:#34342f;--acc:#ff8a4c;--x:#74c0fc;--y:#8ce99a;--z:#ff8a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px}
button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.ax{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.ax b{font-size:15px}.ax small{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;position:relative}
.bar i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;left:50%}
.val{font:600 20px ui-monospace,monospace;min-width:92px;text-align:right}
#scene{height:190px;perspective:500px;display:flex;align-items:center;justify-content:center}
#ph{width:80px;height:150px;border:3px solid var(--fg);border-radius:12px;background:var(--card);position:relative;transform-style:preserve-3d;will-change:transform}
#ph::before{content:"";position:absolute;top:6px;left:50%;width:22px;height:4px;margin-left:-11px;background:var(--mut);border-radius:2px}
#ph::after{content:"YLÄ";position:absolute;bottom:8px;width:100%;text-align:center;font-size:11px;color:var(--mut)}
canvas{width:100%;aspect-ratio:1;border-radius:8px;background:var(--bg);display:block}
.note{color:var(--mut);font-size:13px}
input[type=range]{width:100%}
</style>
</head>
<body>
<h1>Puhelimen asento</h1>
<div class="card row">
  <button class="p" id="start">Käynnistä anturit</button>
  <button id="zero">Nollaa (0°)</button>
</div>
<div class="card"><div id="scene"><div id="ph"></div></div></div>
<div class="card ax">
  <b style="color:var(--x)">X</b><div class="bar"><i id="bx" style="background:var(--x)"></i></div><span class="val" id="vx">–</span>
  <small></small><small>etu-taka (beta)</small><span></span>
  <b style="color:var(--y)">Y</b><div class="bar"><i id="by" style="background:var(--y)"></i></div><span class="val" id="vy">–</span>
  <small></small><small>sivukallistus (gamma)</small><span></span>
  <b style="color:var(--z)">Z</b><div class="bar"><i id="bz" style="background:var(--z)"></i></div><span class="val" id="vz">–</span>
  <small></small><small>suunta (alpha)</small><span></span>
</div>
<div class="card">
  <canvas id="cv" width="480" height="480"></canvas>
  <div class="row" style="margin-top:8px;align-items:center"><span class="note">Zoom</span><input id="zoom" type="range" min="1" max="30" value="10"><span class="note" id="zl">±10°</span></div>
  <div class="note" id="st" style="margin-top:6px">Paina "Käynnistä anturit".</div>
</div>
<script>
const $=id=>document.getElementById(id);
let cur={a:0,b:0,g:0},off={a:0,b:0,g:0},trail=[],n=0,t0=performance.now(),got=false;
const wrap=d=>((d+540)%360)-180;
async function start(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){$('st').textContent='Lupa evätty.';return}
    }
  }catch(e){$('st').textContent='Lupapyyntö epäonnistui: '+e.message;return}
  window.addEventListener('deviceorientation',e=>{
    if(e.beta===null)return;
    got=true;cur={a:e.alpha||0,b:e.beta,g:e.gamma};n++;
    trail.push({t:performance.now(),x:wrap(cur.g-off.g),y:wrap(cur.b-off.b)});
  });
  $('st').textContent='Odotetaan anturidataa…';
  setTimeout(()=>{if(!got)$('st').textContent='Ei anturidataa. Avaa sivu suoraan puhelimen selaimessa (ei upotettuna) ja salli liikeanturit.'},2000);
}
$('start').onclick=start;
$('zero').onclick=()=>{off={...cur};trail=[]};
$('zoom').oninput=e=>$('zl').textContent='±'+e.target.value+'°';
function bar(id,v,r){$(id).style.left=(50+Math.max(-1,Math.min(1,v/r))*48)+'%'}
function draw(){
  const a=wrap(cur.a-off.a),b=wrap(cur.b-off.b),g=wrap(cur.g-off.g);
  $('vx').textContent=b.toFixed(1)+'°';$('vy').textContent=g.toFixed(1)+'°';$('vz').textContent=a.toFixed(1)+'°';
  bar('bx',b,90);bar('by',g,90);bar('bz',a,180);
  $('ph').style.transform=`rotateZ(${-a}deg) rotateX(${-b}deg) rotateY(${g}deg)`;
  const c=$('cv'),x=c.getContext('2d'),W=c.width,R=+$('zoom').value,cs=getComputedStyle(document.documentElement);
  const line=cs.getPropertyValue('--line').trim(),acc=cs.getPropertyValue('--acc').trim(),mut=cs.getPropertyValue('--mut').trim();
  x.clearRect(0,0,W,W);x.strokeStyle=line;x.lineWidth=2;
  for(let i=1;i<=3;i++){x.beginPath();x.arc(W/2,W/2,W/2*i/3.2,0,7);x.stroke()}
  x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,W);x.moveTo(0,W/2);x.lineTo(W,W/2);x.stroke();
  const now=performance.now();trail=trail.filter(p=>now-p.t<3000);
  const px=v=>W/2+v/R*(W/2*0.95);
  x.lineWidth=3;
  for(let i=1;i<trail.length;i++){
    x.globalAlpha=Math.max(0,1-(now-trail[i].t)/3000);x.strokeStyle=acc;
    x.beginPath();x.moveTo(px(trail[i-1].x),px(trail[i-1].y));x.lineTo(px(trail[i].x),px(trail[i].y));x.stroke();
  }
  x.globalAlpha=1;x.fillStyle=acc;x.beginPath();x.arc(px(g),px(b),9,0,7);x.fill();
  x.fillStyle=mut;x.font='20px system-ui';x.fillText('±'+R+'°',8,24);
  if(got){const hz=n/((now-t0)/1000);if(now-t0>1000){$('st').textContent='Päivitys ~'+hz.toFixed(0)+' Hz';if(now-t0>3000){t0=now;n=0}}}
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
