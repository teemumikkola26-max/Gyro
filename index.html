<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laserosumatunnistin</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f1f1ee;--acc:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--mut:#9a9a9a;--card:#252525}}
:root[data-theme="dark"]{--bg:#161616;--fg:#eee;--mut:#9a9a9a;--card:#252525}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 8px}
#wrap{position:relative;background:#000;border-radius:8px;overflow:hidden;min-height:120px}
video{width:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff}
button.s{background:var(--card);color:var(--fg)}
#st{background:var(--card);padding:10px;border-radius:8px;margin:8px 0}
label{color:var(--mut);font-size:14px}
input[type=range]{flex:1;min-width:140px}
#tc{width:100%;max-width:340px;display:block;margin:8px auto;background:var(--card);border-radius:8px}
#list{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Laserosumatunnistin</h1>
<div id="wrap"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
<div id="lv" style="font-size:13px;color:var(--mut)"></div>
<div id="st">Paina Käynnistä kamera.</div>
<div class="row">
<button id="go">Käynnistä kamera</button>
<button id="auto">Tunnista taulu</button>
<button id="cal" class="s">Kalibroi uudelleen</button>
<button id="clr" class="s">Tyhjennä</button>
</div>
<div class="row"><label for="sens">Herkkyys</label><input id="sens" type="range" min="25" max="200" value="90"><label id="sv">90</label></div>
<canvas id="tc" width="320" height="320"></canvas>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const vid=$('v'),ov=$('ov'),octxv=ov.getContext('2d'),tc=$('tc'),tctx=tc.getContext('2d'),st=$('st'),sens=$('sens');
const W=320;let H=240;
const off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
let corners=[],Hm=null,mask=null,bg=null,dif=null,lastHit=0,armed=true,shots=[],flash=null,flashUntil=0,running=false,actx=null;

sens.oninput=()=>$('sv').textContent=sens.value;

function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x;}
function homography(src){const dst=[[0,0],[1,0],[1,1],[0,1]],A=[],b=[];
for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-x*u,-y*u]);b.push(u);A.push([0,0,0,x,y,1,-x*v,-y*v]);b.push(v);}
return solve(A,b);}
function map(h,x,y){const d=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d];}

$('go').onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
    vid.srcObject=s;await vid.play();
    try{const t=s.getVideoTracks()[0],cp=t.getCapabilities?t.getCapabilities():{};if(cp.exposureCompensation)await t.applyConstraints({advanced:[{exposureCompensation:cp.exposureCompensation.min*0.6}]});}catch(e){}
    H=Math.round(W*vid.videoHeight/vid.videoWidth);off.width=W;off.height=H;ov.width=W*3;ov.height=H*3;
    bg=null;dif=new Float32Array(W*H);running=true;resetCal();
  }catch(e){st.textContent='Kameraa ei saatu käyttöön: '+e.message+'. Avaa sivu puhelimen selaimessa (https) ja salli kamera.';}
};
function resetCal(){corners=[];Hm=null;mask=null;st.textContent='Napauta kuvasta taulun neljä kulmaa: 1 vasen ylä, 2 oikea ylä, 3 oikea ala, 4 vasen ala.';}
$('cal').onclick=resetCal;
$('clr').onclick=()=>{shots=[];drawTarget();};

ov.addEventListener('click',e=>{
  if(!running||corners.length>=4)return;
  const r=ov.getBoundingClientRect();
  corners.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);
  if(corners.length<4){st.textContent='Kulma '+corners.length+'/4 asetettu. Napauta seuraava.';return;}
  finishCal();
});

function finishCal(){
  Hm=homography(corners);mask=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const[u,v]=map(Hm,(x+.5)/W,(y+.5)/H);mask[y*W+x]=(u>-.03&&u<1.03&&v>-.03&&v<1.03)?1:0;}
  st.textContent='Valmis. Ammu tauluun laserilla.';
}
function autoDetect(){
  if(!running){st.textContent='Käynnistä kamera ensin.';return;}
  octx.drawImage(vid,0,0,W,H);
  const d=octx.getImageData(0,0,W,H).data,n=W*H,g=new Uint8Array(n),hist=new Array(256).fill(0);
  for(let i=0;i<n;i++){const j=i*4;g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;hist[g[i]]++;}
  let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];
  let wB=0,sB=0,mx=0,th=128;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;th=t;}}
  const seen=new Uint8Array(n);let c=[];
  for(let s0=0;s0<n;s0++){
    if(g[s0]>th||seen[s0])continue;
    const stack=[s0];seen[s0]=1;let area=0,sx=0,sy=0,x0=W,x1=0,y0=H,y1=0,touch=false;
    while(stack.length){
      const p=stack.pop(),x=p%W,y=(p/W)|0;area++;sx+=x;sy+=y;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x===0||y===0||x===W-1||y===H-1)touch=true;
      if(x>0&&g[p-1]<=th&&!seen[p-1]){seen[p-1]=1;stack.push(p-1);}
      if(x<W-1&&g[p+1]<=th&&!seen[p+1]){seen[p+1]=1;stack.push(p+1);}
      if(y>0&&g[p-W]<=th&&!seen[p-W]){seen[p-W]=1;stack.push(p-W);}
      if(y<H-1&&g[p+W]<=th&&!seen[p+W]){seen[p+W]=1;stack.push(p+W);}
    }
    const bw=x1-x0+1,bh=y1-y0+1,asp=bw/bh;
    if(touch||area<30||area>n*0.02||asp<.5||asp>2||area/(bw*bh)<.55)continue;
    c.push({x:sx/area,y:sy/area,a:area});
  }
  const found=c.length;
  c.sort((p,q)=>q.a-p.a);c=c.slice(0,12);
  let best=null;
  for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)for(let k=j+1;k<c.length;k++)for(let l=k+1;l<c.length;l++){
    const pts=[c[i],c[j],c[k],c[l]],ar=pts.map(p=>p.a);
    if(Math.max(...ar)/Math.min(...ar)>3)continue;
    const TL=pts.reduce((m,p)=>p.x+p.y<m.x+m.y?p:m),BR=pts.reduce((m,p)=>p.x+p.y>m.x+m.y?p:m),
          TR=pts.reduce((m,p)=>p.x-p.y>m.x-m.y?p:m),BL=pts.reduce((m,p)=>p.x-p.y<m.x-m.y?p:m);
    if(new Set([TL,TR,BR,BL]).size<4)continue;
    const q=[TL,TR,BR,BL];let qa=0;
    for(let m=0;m<4;m++){const a1=q[m],a2=q[(m+1)%4];qa+=a1.x*a2.y-a2.x*a1.y;}
    qa=Math.abs(qa)/2;
    const sd=q.map((p,m)=>Math.hypot(p.x-q[(m+1)%4].x,p.y-q[(m+1)%4].y));
    if(qa<n*0.04||Math.min(...sd)/Math.max(...sd)<0.3)continue;
    if(!best||qa>best.qa)best={qa,q};
  }
  if(!best){st.textContent='Merkkejä ei löytynyt (tummia ehdokkaita '+found+'). Tarvitaan neljä tummaa täytettyä neliötä taulun kulmissa, kokonaan kuvassa ja selvästi vaaleaa paperia vasten.';return;}
  corners=best.q.map(p=>[(p.x+.5)/W,(p.y+.5)/H]);finishCal();
  st.textContent='Merkit löytyivät, taulu valmis. Jos rajaus on väärin, paina Kalibroi uudelleen ja napauta kulmat itse.';
}
$('auto').onclick=autoDetect;
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator();o.connect(actx.destination);o.frequency.value=880;o.start();o.stop(actx.currentTime+.12);}catch(e){}}

function ft(d,j){const r=d[j],g=d[j+1],b=d[j+2],v=Math.max(r,g,b),c=Math.max(r-(g+b)/2,g-(r+b)/2,0);return v+1.5*c;}
function loop(){
  requestAnimationFrame(loop);
  if(!running||vid.readyState<2)return;
  octx.drawImage(vid,0,0,W,H);
  const d=octx.getImageData(0,0,W,H).data,n=W*H;
  if(!bg){bg=new Float32Array(n);for(let i=0;i<n;i++){const j=i*4;bg[i]=ft(d,j);}}
  const thr=+sens.value;let best=0,bi=-1,cnt=0;
  for(let i=0;i<n;i++){
    const j=i*4,v=ft(d,j),df=v-bg[i];
    if(mask&&mask[i]&&df>thr){dif[i]=df;cnt++;if(df>best){best=df;bi=i;}}else dif[i]=0;
    bg[i]+=(v-bg[i])*0.08;
  }
  const now=performance.now();
  $('lv').textContent='Piikki '+Math.round(best)+' / raja '+thr;
  if(Hm){
    if(cnt===0&&now-lastHit>250)armed=true;
    if(bi>=0&&armed&&cnt<600){
      const px=bi%W,py=(bi/W)|0;let sx=0,sy=0,sw=0;
      for(let y=Math.max(0,py-7);y<=Math.min(H-1,py+7);y++)for(let x=Math.max(0,px-7);x<=Math.min(W-1,px+7);x++){
        const w=dif[y*W+x];if(w>best*.5){sx+=x*w;sy+=y*w;sw+=w;}}
      const cx=(sx/sw+.5)/W,cy=(sy/sw+.5)/H,[u,v]=map(Hm,cx,cy);
      const dist=Math.hypot(u-.5,v-.5),score=dist>=.5?0:10-Math.floor(dist/.05);
      shots.push({u,v,score});lastHit=now;armed=false;flash=[cx,cy];flashUntil=now+1200;
      beep();if(navigator.vibrate)navigator.vibrate(60);
      st.textContent='Laukaus '+shots.length+': '+score+' pistettä';drawTarget();
    }
  }
  drawOverlay(now);
}
function drawOverlay(now){
  const w=ov.width,h=ov.height;octxv.clearRect(0,0,w,h);
  octxv.strokeStyle='#0f0';octxv.lineWidth=3;octxv.fillStyle='#0f0';
  corners.forEach(([x,y])=>{octxv.beginPath();octxv.arc(x*w,y*h,8,0,7);octxv.fill();});
  if(corners.length>1){octxv.beginPath();corners.forEach(([x,y],i)=>i?octxv.lineTo(x*w,y*h):octxv.moveTo(x*w,y*h));if(corners.length===4)octxv.closePath();octxv.stroke();}
  if(flash&&now<flashUntil){octxv.strokeStyle='#f33';octxv.lineWidth=4;octxv.beginPath();octxv.arc(flash[0]*w,flash[1]*h,24,0,7);octxv.stroke();}
}
function drawTarget(){
  const s=tc.width,c=s/2;tctx.clearRect(0,0,s,s);
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  for(let i=10;i>=1;i--){const r=c*i/10;tctx.beginPath();tctx.arc(c,c,r,0,7);tctx.fillStyle=i<=2?'#d33':(i%2?(dark?'#333':'#ddd'):(dark?'#444':'#bbb'));tctx.fill();tctx.strokeStyle=dark?'#777':'#666';tctx.lineWidth=1;tctx.stroke();}
  shots.forEach((p,i)=>{const x=p.u*s,y=p.v*s;tctx.beginPath();tctx.arc(x,y,6,0,7);tctx.fillStyle=i===shots.length-1?'#06f':'#0a0';tctx.fill();tctx.strokeStyle='#fff';tctx.lineWidth=2;tctx.stroke();});
  const tot=shots.reduce((a,p)=>a+p.score,0);
  $('list').innerHTML=shots.length?('Yhteensä '+tot+' p ('+shots.length+' laukausta)<br>'+shots.map((p,i)=>(i+1)+': '+p.score+' p').join(' · ')):'Ei laukauksia.';
}
drawTarget();loop();
</script>
</body>
</html>
